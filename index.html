<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Issue Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    .post { border-bottom: 1px solid #ddd; padding: 20px 0; }
    .post-title { font-size: 1.4em; font-weight: bold; }
    .post-date { color: #666; font-size: 0.9em; }
    .post-body { margin-top: 10px; }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>

<h1>GitHub Issue Blog</h1>
<div id="posts"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const user = "m-owada";
  const repo = "blog";

  async function loadIssues() {
    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/issues`);
    const issues = await res.json();

    const container = document.getElementById("posts");
    container.innerHTML = "";

    issues.forEach(issue => {
      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <div class="post-title">${issue.title}</div>
        <div class="post-date">${new Date(issue.created_at).toLocaleDateString()}</div>
        <div class="post-body">${marked.parse(issue.body || "")}</div>
        <a href="${issue.html_url}" target="_blank">GitHub で読む</a>
      `;

      container.appendChild(div);
    });
  }

  loadIssues();
</script>

</body>
</html>
