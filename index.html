<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Beer Memo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    line-height: 1.7;
    background: #fafafa;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  /* 🔍 検索ボックス */
  #search {
    width: 100%;
    padding: 12px 16px;
    font-size: 1em;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 30px;
  }

  .post {
    background: #fff;
    padding: 24px;
    margin-bottom: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .post-title {
    font-size: 1.6em;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .post-date {
    color: #666;
    font-size: 0.9em;
    margin-bottom: 16px;
  }

  .post-body {
    margin-top: 10px;
  }

  .post-body img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 16px auto;
    border-radius: 8px;
  }

  pre {
    background: #272822;
    color: #f8f8f2;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
  }

  code {
    background: #eee;
    padding: 2px 4px;
    border-radius: 4px;
  }

  a {
    color: #0366d6;
    text-decoration: none;
  }
  </style>
</head>
<body>

<h1>Beer Memo</h1>

<!-- 🔍 検索ボックス -->
<input id="search" placeholder="検索ワードを入力..." />

<div id="posts"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const user = "m-owada";
  const repo = "blog";

  let allIssues = []; // ← 全件保存して検索に使う

  async function loadIssues() {
    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/issues`);
    allIssues = await res.json();
    allIssues = allIssues.reverse().map((issue, index) => ({
      ...issue,
      serial: index + 1
    }));
    render(allIssues.reverse());
  }

  function render(issues) {
    const container = document.getElementById("posts");
    container.innerHTML = "";

    issues.forEach(issue => {
      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <div class="post-title">#${issue.serial} ${issue.title}</div>
        <div class="post-date">${new Date(issue.created_at).toLocaleDateString()}</div>
        <div class="post-body">${enableLazyLoad(marked.parse((issue.body || "").replace(/\n/g, "  \n")))}</div>
        <a href="${issue.html_url}" target="_blank">GitHub で読む</a>
      `;

      container.appendChild(div);
    });
  }

  function enableLazyLoad(html) {
    return html.replace(/<img /g, '<img loading="lazy" ');
  }

  // 🔍 検索イベント
  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();

    const filtered = allIssues.filter(issue =>
      issue.title.toLowerCase().includes(q) ||
      (issue.body || "").toLowerCase().includes(q)
    );

    render(filtered);
  });

  loadIssues();
</script>

</body>
</html>
